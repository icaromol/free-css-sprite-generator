<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Free CSS Sprite Generator — editor</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Free CSS Sprite Generator</h1>
      <p>Local tool — draw/edit <code>art/*.json</code> pixel-grid sprites, save straight to disk.</p>
    </header>

    <main class="layout">
      <section class="panel panel--canvas">
        <div class="row">
          <label>
            Sprite name:
            <input type="text" id="sprite-name" placeholder="e.g. campfire" />
          </label>
          <button id="save-btn" type="button">Save</button>
          <select id="export-select" title="Export as...">
            <option value="" selected>Export as…</option>
            <option value="all">All (JSON + PNG + WebP + SCSS)</option>
            <option value="json">JSON</option>
            <option value="png">PNG</option>
            <option value="webp">WebP</option>
            <option value="scss">SCSS</option>
          </select>
          <span id="status" role="status"></span>
        </div>

        <div class="row">
          <label class="file-btn" title="Replace this sprite's art with a new image, keeping its current name">
            Replace
            <input type="file" id="import-replace-input" accept="image/*" hidden />
          </label>
          <label class="file-btn" title="Import a new sprite from an image, named after the file">
            Import new
            <input type="file" id="import-new-input" accept="image/*" hidden />
          </label>
          <label>
            Import colors:
            <select id="import-mode">
              <option value="precise" selected>Precise (exact color)</option>
              <option value="conform">Conform to palette</option>
            </select>
          </label>
          <label>
            Existing sprite:
            <select id="sprite-select">
              <option value="">— new —</option>
            </select>
          </label>
        </div>

        <div class="row">
          <label>
            Sprite size:
            <input type="range" id="sprite-size" min="0" max="5" step="1" value="3" />
            <span id="sprite-size-value">64px</span>
          </label>
          <span id="dimension-hint" class="hint"></span>
          <label>
            Zoom:
            <input type="range" id="view-zoom" min="15" max="400" step="5" value="100" />
            <span id="view-zoom-value">100%</span>
          </label>
        </div>

        <canvas id="grid-canvas" width="512" height="512"></canvas>

        <div class="row">
          <button id="remove-bg-btn" type="button" class="secondary-btn icon-btn" title="Remove background — clears the drawing's 4 corner colors">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
              <rect x="3" y="3" width="8" height="8" fill="#999"></rect>
              <rect x="13" y="3" width="8" height="8" fill="#555"></rect>
              <rect x="3" y="13" width="8" height="8" fill="#555"></rect>
              <rect x="13" y="13" width="8" height="8" fill="#999"></rect>
              <line x1="3" y1="21" x2="21" y2="3" stroke="#e05252" stroke-width="2.5"></line>
            </svg>
          </button>
          <button id="maximize-btn" type="button" class="secondary-btn icon-btn" title="Maximize item — scales the drawing to the largest size that fits, without distorting it">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
              <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </button>
          <button id="fit-to-art-btn" type="button" class="secondary-btn icon-btn" title="Fit to art — trims transparent padding and snaps the longer edge to the sprite-size slider's value">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
              <path d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </button>
        </div>

        <div class="row">
          <label>
            Simplify colors:
            <input type="range" id="color-count" min="2" max="15" step="1" value="15" />
            <span id="color-count-value">15 colors</span>
          </label>
        </div>
      </section>

      <section class="panel panel--palette">
        <h2>Palette</h2>

        <div class="row">
          <label>
            Brush/eraser size:
            <input type="range" id="brush-size" min="1" max="8" step="1" value="1" />
            <span id="brush-size-value">1px</span>
          </label>
          <span class="hint">[ / ] brush size · E: eraser · M: move · Shift+wheel: zoom</span>
        </div>

        <div id="palette-swatches" class="swatches"></div>

        <div class="row">
          <button id="palette-add-toggle" type="button" class="secondary-btn">+ Add color</button>
        </div>
        <div id="palette-add-form" class="row" style="display: none">
          <input type="color" id="palette-add-color" value="#888888" />
          <input type="text" id="palette-add-label" placeholder="Color name" maxlength="60" />
          <button id="palette-add-confirm" type="button">Add</button>
          <button id="palette-add-cancel" type="button" class="secondary-btn">Cancel</button>
        </div>

        <div id="local-palette-section" style="display: none">
          <h2>Image colors</h2>
          <div id="local-swatches" class="swatches"></div>
        </div>

        <h2>CSS preview</h2>
        <pre id="css-preview" class="css-preview"></pre>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
